<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance Console</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1d232b; --muted: #66707c; --line: #dde1e6;
    --accent: #1f7a8c; --accent-ink: #ffffff; --warn: #b5541c; --ok: #2e7d4f; --chip: #eef2f5;
    --series-1: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15191e; --panel: #1d232a; --ink: #e6e9ed; --muted: #9aa4af; --line: #2e3640; --accent: #3fa7bb; --accent-ink: #0d1115; --warn: #e08a5a; --ok: #6cc690; --chip: #262e37; --series-1: #3987e5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  #status { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  #status.dirty { color: var(--warn); }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 12px; }
  nav { display: flex; gap: 2px; padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 12px; white-space: nowrap; background: none; }
  nav button.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
  main { padding: 18px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 16px; }
  label.field { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
  label.field span { display: flex; justify-content: space-between; gap: 6px; }
  label.field.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; width: 100%; }
  input[type=checkbox] { width: auto; }
  input[type=color] { padding: 0; height: 30px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .split { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .list button { text-align: left; display: flex; justify-content: space-between; border-color: transparent; }
  .list button.active { border-color: var(--accent); background: var(--chip); }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--chip); color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td input, td select { padding: 3px 5px; min-width: 64px; }
  td select { min-width: 130px; }
  table.matrix th.rot { height: 120px; vertical-align: bottom; }
  table.matrix th.rot div { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
  table.matrix td { text-align: center; }
  table.matrix td.self { background: var(--chip); }
  table.matrix td select.rel { min-width: 0; width: 34px; padding: 2px; text-align: center; font-weight: 600; appearance: none; -webkit-appearance: none; cursor: pointer; }
  select.rel.r0 { color: var(--muted); }
  select.rel.r1 { background: #c0392b; color: #fff; border-color: #c0392b; }
  select.rel.r2 { background: #d68910; color: #fff; border-color: #d68910; }
  select.rel.r3 { background: #229954; color: #fff; border-color: #229954; }
  .legend span { display: inline-block; margin-right: 14px; }
  .legend b { display: inline-block; width: 22px; text-align: center; border-radius: 4px; color: #fff; margin-right: 4px; }
  textarea.raw { min-height: 60vh; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  #toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 420px; }
  #toast.show { opacity: 0.95; }
  .crumbs { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .foods { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  td.readout { color: var(--muted); white-space: nowrap; }
  table.sortable th.sorthead { cursor: pointer; user-select: none; }
  table.sortable th.sorthead:hover { color: var(--ink); }
  table.sortable th.sorthead::after { content: " ↕"; opacity: .35; }
  table.sortable th.sorthead.asc::after { content: " ▲"; opacity: .9; }
  table.sortable th.sorthead.desc::after { content: " ▼"; opacity: .9; }
  td.pct { font-variant-numeric: tabular-nums; }
  tr.off td { opacity: .5; }
  .pin { border: none; background: none; padding: 0 2px; font-size: 13px; line-height: 1; color: var(--muted); opacity: .45; cursor: pointer; }
  .pin:hover { opacity: 1; color: var(--accent); }
  .pin.on { opacity: 1; color: #d4a017; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tile-label { font-size: 12px; color: var(--muted); }
  .tile-value { font-size: 22px; font-weight: 650; margin: 2px 0; }
  .tile-sub { font-size: 12px; color: var(--muted); }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
  @media (max-width: 520px) { .charts { grid-template-columns: 1fr; } }
  .chart-wrap { position: relative; }
  .chart-title { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  svg.chart .grid { stroke: var(--line); stroke-width: 1; }
  svg.chart .axis { fill: var(--muted); font-size: 10px; }
  svg.chart .band { fill: var(--series-1); opacity: .15; stroke: none; }
  svg.chart .line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .hair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  svg.chart .dot { fill: var(--series-1); stroke: var(--panel); stroke-width: 2; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; display: none; z-index: 2; }
  .split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .split2 { grid-template-columns: 1fr; } }
  .diary { max-height: 320px; overflow: auto; font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; }
  .sim-tank { border-left: 3px solid var(--accent); }
  .sim-tank h3 { font-size: 12.5px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<header>
  <h1>Fish Breeder · Balance Console</h1>
  <input id="search" type="search" placeholder="Search settings…" title="Find any setting by name, help text or section" style="width:220px">
  <div id="status">Loading…</div>
  <button id="reload" title="Throw away unsaved edits and load the saved file">Reload</button>
  <button id="defaults" title="Load the defaults from the game code (not saved until you press Save)">Load defaults</button>
  <button id="save" class="primary">Save</button>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="toast"></div>

    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);

function toast(text) {
  const t = $("#toast");

function markDirty() {
  dirty = true;
  keepDraft();
  $("#status").textContent = "Unsaved changes";
  $("#status").classList.add("dirty");
}

async function refreshStatus(text) {
  try {
    const status = await (await fetch("/api/status")).json();
    $("#status").classList.remove("dirty");
    $("#status").textContent = (text ? text + " · " : "") + (status.playing ? "Game is playing: Save applies instantly" : "Game not playing: values apply next Play") + (status.saved ? "" : " · no balance file yet (showing code defaults)");
  } catch {
    $("#status").textContent = "Can't reach Unity. Is the editor open?";
  }
}

// Every number is kept to 2 decimals. Small non-zero values round up to 0.01 so they never vanish.
function round2(value) {
  if (Array.isArray(value)) return value.map(round2);
  if (value && typeof value === "object") {
    for (const key of Object.keys(value)) value[key] = round2(value[key]);
    return value;
  }
  if (typeof value !== "number" || Number.isInteger(value)) return value;
  const rounded = Math.round(value * 100) / 100;
  if (rounded === 0 && value !== 0) return value > 0 ? 0.01 : -0.01;
  return rounded;
}

const DRAFT_KEY = "fishBreederBalanceDraft";
function keepDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch {} }
function dropDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch {} }
function readDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch { return null; } }

async function load(url) {
  const res = await fetch(url);
  data = round2(await res.json());
  dirty = url !== "/api/balance";
  const draft = url === "/api/balance" ? readDraft() : null;
  if (draft && JSON.stringify(round2(draft)) !== JSON.stringify(data) &&
      confirm("You have unsaved edits from an earlier visit that never reached the game. Bring them back?")) {
    data = round2(draft);
    dirty = true;
  } else if (url === "/api/balance") dropDraft();
  render();
  if (dirty) markDirty(); else refreshStatus("Loaded");
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Unity stops answering for a few seconds while it recompiles, so a failed save is retried
// for up to a minute, and the edits stay in this browser until one gets through.
async function save() {
  round2(data);
  keepDraft();
  const body = JSON.stringify(data, null, 2);
  for (let attempt = 1; attempt <= 20; attempt++) {
    try {
      const res = await fetch("/api/balance", { method: "POST", headers: { "Content-Type": "application/json" }, body });
      const reply = await res.json().catch(() => ({ ok: false }));
      if (!reply.ok) { toast("Save failed: " + (reply.error || res.status) + ". Your edits are kept in this browser."); return; }
      dirty = false;
      dropDraft();
      render();
      refreshStatus("Saved");
      toast(reply.applied ? "Saved and applied to the running game." : "Saved. The game uses it next time you press Play.");
      return;
    } catch {
      $("#status").textContent = `Unity isn't answering (it may be recompiling). Retrying save ${attempt}/20...`;
      $("#status").classList.add("dirty");
      await sleep(3000);
    }
  }
  toast("Couldn't reach Unity, so nothing was saved. Your edits are kept in this browser; press Save again once Unity is open.");
}

// A filter, heater or bubbler's "effect" is a number, not the perk effect list.
const enumFor = (obj, key) => (key === "effect" && obj && "breakChance" in obj ? null : ENUMS[key]);

function input(obj, key, onChange) {
  const value = obj[key];
  const changed = (v) => { obj[key] = v; markDirty(); if (onChange) onChange(); };
  const options = enumFor(obj, key);
  if (options) {
    const select = el("select", { onchange: (e) => changed(parseInt(e.target.value, 10)) },
      options.map((name, i) => el("option", { value: i }, name)));
    select.value = value;
    return select;
  }
  if (typeof value === "boolean") {
    const box = el("input", { type: "checkbox", onchange: (e) => changed(e.target.checked) });
    box.checked = value;
    return box;
  }
  if (typeof value === "number") {
    return el("input", { type: "number", step: "0.01", value, oninput: (e) => { const n = parseFloat(e.target.value); if (!isNaN(n)) changed(n); } });
  }
  if (value && typeof value === "object" && "r" in value && "g" in value) {
    const hex = "#" + ["r", "g", "b"].map((c) => Math.round(Math.min(1, Math.max(0, value[c])) * 255).toString(16).padStart(2, "0")).join("");
    return el("input", { type: "color", value: hex, oninput: (e) => {
      const h = e.target.value;
      obj[key] = { r: parseInt(h.slice(1, 3), 16) / 255, g: parseInt(h.slice(3, 5), 16) / 255, b: parseInt(h.slice(5, 7), 16) / 255, a: value.a ?? 1 };
      markDirty();
    } });
  }
  return el("input", { type: "text", value: value ?? "", oninput: (e) => changed(e.target.value) });
}

/** Favourite foods: one checkbox per food type. */
function foodChecks(obj, key) {

    const box = el("input", { type: "checkbox", onchange: (e) => {

      markDirty();
    } });
    box.checked = obj[key].includes(i);

  });
  return el("div", { class: "field", title: help(key) }, el("span", {}, nice(key)), el("div", { class: "foods" }, boxes));
}

function field(obj, key, onChange) {
  if (key === "favoriteFoods") return foodChecks(obj, key);
  const control = input(obj, key, onChange);

  return el("label", { class: "field", title: help(key) }, el("span", {}, nice(key), pin), control);

/** Every simple field of an object as a form; lists of objects become small tables. */
function objectForm(obj, skip = []) {
  const grid = el("div", { class: "grid" });
  const extras = [];
  for (const key of Object.keys(obj)) {
    if (skip.includes(key)) continue;
    const value = obj[key];
    if (Array.isArray(value) && value.length && typeof value[0] === "object") extras.push(listTable(nice(key), value));
    else if (!Array.isArray(value)) grid.append(field(obj, key));
    else if (key === "favoriteFoods") grid.append(foodChecks(obj, key));
    else if (!value.length || typeof value[0] !== "object") grid.append(listField(obj, key));
  }
  return [grid, ...extras];
}

/** A list of plain values (like decoration ids) as comma separated text. */
function listField(obj, key) {
  const numbers = obj[key].length && typeof obj[key][0] === "number";
  const box = el("input", { type: "text", value: obj[key].join(", "), oninput: (e) => {
    const parts = e.target.value.split(",").map((t) => t.trim()).filter((t) => t);

const REL_LETTER = ["·", "P", "C", "+"];
const SYMMETRIC = [0, 2, 3];

function relationOf(a, b) {
  const entry = (data.relationships || []).find((r) => r.a === a.id && r.b === b.id);
  return entry ? entry.relation : 0;
}

function setRelation(a, b, relation) {
  data.relationships = (data.relationships || []).filter((r) => !(r.a === a.id && r.b === b.id));
  if (relation !== 0) data.relationships.push({ a: a.id, b: b.id, relation });
}

function renderCompat() {
  const species = data.species;
  data.relationships = data.relationships || [];
  const change = (a, b, relation) => {
    setRelation(a, b, relation);
    if (a !== b) {
      const back = relationOf(b, a);
      // Nipping, liking and getting along go both ways; prey of a predator doesn't like it back.
      if (SYMMETRIC.includes(relation) && back !== 1) setRelation(b, a, relation);
      if (relation === 1 && (back === 2 || back === 3)) setRelation(b, a, 0);
    }
    markDirty();
    render();
  };
  const cell = (a, b) => {
    const value = relationOf(a, b);

const crossData = () => {
  const cross = data.crossBreeding = data.crossBreeding || { crossChanceMultiplier: 0.5, tailWithFins: 0.75, pairs: [], combos: [] };
  cross.pairs = cross.pairs || [];
  cross.combos = cross.combos || [];
  return cross;
};
const speciesById = (id) => data.species.find((s) => s.id === id);
const crossPaired = (a, b) => crossData().pairs.some((p) => (p.a === a && p.b === b) || (p.a === b && p.b === a));

/** The combo for this body and fins, made with the game's default values if missing. */
function crossCombo(body, fins) {
  const cross = crossData();
  let combo = cross.combos.find((c) => c.body === body && c.fins === fins);
  if (!combo) {
    const value = (id) => (speciesById(id) || { baseValue: 20 }).baseValue;
    combo = { body, fins, name: "", chance: 1, value: Math.round((value(body) + value(fins)) * 1.5) };
    cross.combos.push(combo);
  }
  return combo;
}

function renderCross() {
  const species = data.species;
  const cross = crossData();
  const toggle = (a, b, on) => {
    cross.pairs = cross.pairs.filter((p) => !((p.a === a && p.b === b) || (p.a === b && p.b === a)));
    if (on) {
      cross.pairs.push({ a, b });
      crossCombo(a, b);
      crossCombo(b, a);
    }
    markDirty();
    render();
  };
  const cell = (a, b) => {
    if (a === b) return el("td", { class: "self", title: "Every species breeds with its own kind" }, "✓");
    const box = el("input", { type: "checkbox", title: `${a.displayName} × ${b.displayName}`, onchange: (e) => toggle(a.id, b.id, e.target.checked) });
    box.checked = crossPaired(a.id, b.id);
    return el("td", {}, box);
  };

    el("thead", {}, el("tr", {}, el("th", {}, "Can cross with →"), species.map((s) => el("th", { class: "rot" }, el("div", {}, s.displayName))))),
    el("tbody", {}, species.map((a) => el("tr", {}, el("th", {}, a.displayName), species.map((b) => cell(a, b))))));

  const pairs = cross.pairs.filter((p) => p.a !== p.b && speciesById(p.a) && speciesById(p.b));
  const rows = [];
  for (const pair of pairs) {
    const ways = [crossCombo(pair.a, pair.b), crossCombo(pair.b, pair.a)];
    const odds = [];
    const refreshOdds = () => {
      const total = Math.max(0, ways[0].chance) + Math.max(0, ways[1].chance);
      ways.forEach((c, i) => { odds[i].textContent = total > 0 ? `${Math.round(Math.max(0, c.chance) / total * 100)}%` : "50%"; });

    rows.push(el("tr", {}, el("th", { colspan: 8, style: "padding-top:12px" }, `${speciesById(pair.a).displayName} × ${speciesById(pair.b).displayName}`)));
    ways.forEach((combo, i) => {
      const body = speciesById(combo.body), fins = speciesById(combo.fins);
      odds[i] = el("td", { class: "readout" });
      rows.push(el("tr", {},
        el("td", {}, body.displayName),
        el("td", {}, fins.displayName),
        el("td", {}, (() => { const box = input(combo, "name"); box.placeholder = `${body.displayName} with ${fins.displayName} fins`; return box; })()),
        el("td", {}, input(combo, "chance", refreshOdds)),
        odds[i],
        el("td", {}, input(combo, "value")),
        el("td", { class: "readout" }, `$${body.baseValue} / $${fins.baseValue}`)));
    });
    refreshOdds();
  }
  const combos = el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {},
      el("th", {}, "Body"), el("th", {}, "Fins"), el("th", { title: "Shown in game. Empty uses the placeholder name." }, "Name"),
      el("th", { title: help("chance") }, "Chance"), el("th", {}, "This way round"),
      el("th", { title: "What a healthy, common-looking adult with this look is worth. Replaces the body species' value." }, "Value ($)"),
      el("th", { title: "The base values of the body and fins species, for reference" }, "Parents' values"))),
    el("tbody", {}, rows)));

  return [
    el("div", { class: "card" },

/** Average days a new piece of equipment runs before its first breakdown. */
function expectedLife(item) {
  let survive = 1, steps = 0;
  for (let n = 0; n < 5000 && survive > 1e-4; n++) {
    const chance = Math.min(1, Math.min(item.maxBreakChance, item.breakChance + item.breakChancePerStep * n));
    steps += survive;
    survive *= 1 - chance;
  }
  return `${(steps / 2).toFixed(1)} days`;
}

// ---------------------------------------------------------------- pinned settings

// Pins are kept in this browser (they're your own shortlist, not part of the balance file).
// Each pin is a path into the balance data; list items are found by id or name, so a pin
// survives reordering and reloading.
const PIN_KEY = "fishBreederPinnedSettings";
let pins = (() => { try { return JSON.parse(localStorage.getItem(PIN_KEY) || "[]"); } catch { return []; } })();
let pathIndex = new WeakMap();

function savePins() { try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch {} }

function itemKey(item, i) {
  for (const f of ["id", "name", "title", "displayName"]) if (typeof item[f] === "string" && item[f]) return `@${f}=${item[f]}`;
  if (item.body && item.fins) return `@combo=${item.body}+${item.fins}`;
  return `#${i}`;
}

/** Remembers where every object in the balance data lives, so a field can name its own path. */
function indexPaths() {
  pathIndex = new WeakMap();
  const walk = (obj, segs) => {
    pathIndex.set(obj, segs);
    for (const k of Object.keys(obj)) {
      const v = obj[k];
      if (Array.isArray(v)) v.forEach((item, i) => { if (item && typeof item === "object") walk(item, [...segs, k, itemKey(item, i)]); });
      else if (v && typeof v === "object" && !("r" in v && "g" in v)) walk(v, [...segs, k]);
    }
  };
  if (data) walk(data, []);
}

function pinPath(obj, key) {
  const segs = pathIndex.get(obj);
  return segs ? JSON.stringify([...segs, key]) : null;
}

function resolveItem(list, seg) {
  if (!Array.isArray(list)) return undefined;
  if (seg.startsWith("#")) return list[parseInt(seg.slice(1), 10)];
  if (seg.startsWith("@combo=")) { const [b, f] = seg.slice(7).split("+"); return list.find((x) => x && x.body === b && x.fins === f); }
  const [f, v] = seg.slice(1).split(/=(.*)/s);
  return list.find((x) => x && x[f] === v);
}

/** The object and key a pin points at, or null if that setting no longer exists. */
function resolvePin(path) {
  let segs;
  try { segs = JSON.parse(path); } catch { return null; }
  let cur = data;
  for (let i = 0; i < segs.length - 1 && cur; i++) {
    const seg = segs[i];
    cur = Array.isArray(cur) ? resolveItem(cur, seg) : cur[seg];
  }
  const key = segs[segs.length - 1];
  return cur && typeof cur === "object" && key in cur ? { obj: cur, key, segs } : null;
}

function pinCrumbs(segs) {
  let cur = data;
  return segs.slice(0, -1).map((seg, i) => {
    const list = cur;
    cur = cur && cur[seg];
    if (!seg.startsWith("@") && !seg.startsWith("#")) return i === 0 ? (TOP_NAMES[seg] || nice(seg)) : nice(seg);
    cur = resolveItem(list, seg);
    if (cur && (cur.displayName || cur.name || cur.title)) return cur.displayName || cur.name || cur.title;
    return seg.startsWith("#") ? `#${parseInt(seg.slice(1), 10) + 1}` : seg.slice(1).split(/=(.*)/s)[1].replace("+", " with ");
  }).join(" › ");
}

function pinButton(obj, key) {
  const path = pinPath(obj, key);
  if (!path) return null;
  const on = pins.includes(path);
  return el("button", {
    class: "pin" + (on ? " on" : ""), type: "button", title: on ? "Unpin" : "Pin to Pinned settings",
    onclick: (e) => {
      e.preventDefault(); e.stopPropagation();
      pins = on ? pins.filter((p) => p !== path) : [...pins, path];
      savePins();
      render();
    },
  }, on ? "★" : "☆");
}

function renderPinned() {
  if (!pins.length) return [el("div", { class: "card" }, el("h2", {}, "Pinned settings"),
    el("p", { class: "hint" }, "Click the ☆ next to any setting to pin it here, so the ones you tweak most are in one place. Settings that only appear in tables (like decoration prices) can be pinned from the search results. Pins are kept in this browser."))];
  const cards = [];
  const missing = [];
  let last = null, grid = null;
  for (const path of pins) {
    const found = resolvePin(path);
    if (!found) { missing.push(path); continue; }
    const where = pinCrumbs(found.segs);
    if (where !== last) {
      grid = el("div", { class: "grid" });
      cards.push(el("div", { class: "card" }, el("p", { class: "crumbs" }, where), grid));
      last = where;
    }
    grid.append(field(found.obj, found.key));
  }
  const head = el("p", { class: "hint" }, `${pins.length - missing.length} pinned. Click ★ to unpin. Edits here are the same as on the tabs.`);
  const out = [head, ...cards];
  if (missing.length) out.push(el("div", { class: "card" },
    el("p", { class: "hint" }, `${missing.length} pinned setting${missing.length === 1 ? " no longer exists" : "s no longer exist"} (renamed or removed).`),
    el("button", { class: "small", onclick: () => { pins = pins.filter((p) => !missing.includes(p)); savePins(); render(); } }, "Remove them")));
  return out;
}

// A stand-alone copy of the game's time-step rules (Shop/TimeStep.cs, Tank.OnTimeStep,
// Fish.OnTimeStep, FishHealth, TankMates, BreedingSystem, EggClutch), run on the numbers in

// steps (opening and closing), then the night (Grandma's gift before the grand opening, or her
// rescue when broke after it). Perks, research,

// ---- the rules

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const lerp = (a, b, t) => a + (b - a) * clamp01(t);
const moveTowards = (v, target, step) => (Math.abs(target - v) <= step ? target : v + Math.sign(target - v) * step);
const outsideBy = (v, lo, hi) => (v < lo ? lo - v : v > hi ? v - hi : 0);

function simulate(setup, B, seed) {
  const rnd = mulberry32(seed);
  const chance = (p) => rnd() < p;
  const range = (lo, hi) => lo + (hi - lo) * rnd();
  const rangeInt = (lo, hiExclusive) => lo + Math.floor(rnd() * Math.max(0, hiExclusive - lo));
  const pick = (list) => list[Math.floor(rnd() * list.length)];

  const ts = B.timeStep, hb = B.health, rules = B.rules, med = B.medicine, mates = B.tankMates, sup = B.supplier, store = B.store;
  const species = new Map(B.species.map((s) => [s.id, s]));
  const relations = new Map();
  for (const r of B.relationships || []) {
    if (!relations.has(r.a)) relations.set(r.a, new Map());
    relations.get(r.a).set(r.b, r.relation);
  }
  const relation = (a, b) => { const row = relations.get(a); return (row && row.get(b)) || 0; };
  const competitive = (a, b) => relation(a, b) === 2 || relation(b, a) === 2;
  const pairs = (B.crossBreeding && B.crossBreeding.pairs) || [];
  const canCross = (a, b) => a !== b && pairs.some((p) => (p.a === a && p.b === b) || (p.a === b && p.b === a));
  const foods = sup.food || [];
  const foodInfo = (type) => foods.find((f) => f.type === type) || { type, name: ENUMS.type[type], price: 0, feedings: 1, nutrition: 0.35, contamination: 1, spoilChance: 0 };
  const diseases = (B.diseases || []).filter((d) => d);
  const every = ts.extraWipeEveryFishkeepingLevels;
  const wipesPerSession = Math.max(1, ts.wipesPerSession + (every > 0 ? Math.floor((setup.level - 1) / every) : 0));
  const wipeSkill = 1 + B.progression.wipeBonusPerFishkeepingLevel * (setup.level - 1);

  const out = {
    alive: [], money: [], sick: [], tankAlive: setup.tanks.map(() => []), tankWater: setup.tanks.map(() => []),
    born: 0, died: 0, eaten: 0, causes: {}, fellIll: 0, cured: 0, recovered: 0, overdoses: 0, doses: 0,
    cost: { fish: 0, tanks: 0, equipment: 0, food: 0, medicine: 0, conditioner: 0, repairs: 0 },
    income: { sales: 0, allowance: 0 }, sold: 0, brokeDay: null, bailouts: 0, missedFeedings: 0, breakdowns: 0,
    speciesStats: {}, start: 0, diary: [],
  };
  const diary = (day, text) => { if (out.diary.length < 400) out.diary.push(`Day ${day}: ${text}`); };
  const spStat = (id) => out.speciesStats[id] || (out.speciesStats[id] = { start: 0, end: 0, born: 0, died: 0, eaten: 0, sold: 0 });

  let money = setup.money;
  let day = 0;
  const stock = { food: {} };
  const spend = (amount, what, bucket) => {
    if (amount <= 0) return true;
    if (money < amount) {
      if (out.brokeDay === null) { out.brokeDay = day; diary(day, `couldn't afford ${what} ($${amount}, had $${money})`); }
      return false;
    }
    money -= amount;
    out.cost[bucket] += amount;
    return true;
  };

  // ---- fish

  const randomGenes = () => ({ h: [rnd(), rnd()], l: [rnd(), rnd()] });
  const childGenes = (m, f) => {
    const allele = (a, b) => {
      let v = chance(0.5) ? a[Math.floor(rnd() * 2)] : b[Math.floor(rnd() * 2)];
      if (chance(rules.mutationChance)) v = clamp01(v + range(-rules.mutationStrength, rules.mutationStrength));
      return v;
    };
    return { h: [allele(m.h, m.h), allele(f.h, f.h)], l: [allele(m.l, m.l), allele(f.l, f.l)] };
  };
  const makeFish = (sp, genes, growth, gen) => {
    const s = species.get(sp);
    return {
      sp, s, genes, gen, growth, age: growth * s.daysToAdult, hunger: range(0, 0.2), male: chance(0.5),
      hard: (genes.h[0] + genes.h[1]) / 2, len: lerp(s.minLength, s.maxLength, (genes.l[0] + genes.l[1]) / 2),
      health: 1, disease: null, severity: 0, injury: 0, load: 0, stress: 0, damage: 0, cooldown: 0, sinceFav: 99,
      pregnant: null, valueFactor: range(0.8, 1.25), dead: false,
    };
  };
  const stage = (f) => (f.growth >= 1 ? 2 : f.growth >= 0.4 ? 1 : 0);
  const bodyLength = (f) => (stage(f) === 0 ? 0.045 : f.len) * lerp(0.5, 1, f.growth);
  const starving = (f) => f.hunger >= rules.starvingThreshold;
  const infertile = (f) => f.damage > 0 && f.damage >= med.infertileAtDamage;
  const value = (f) => {
    const st = [0.3, 0.6, 1][stage(f)];
    return Math.max(1, Math.round(f.s.baseValue * st * lerp(0.4, 1, f.health) * clamp01(1 - f.damage * med.damageValue)));
  };

  // ---- tanks

  const tanks = setup.tanks.map((cfg, index) => {
    const sizes = store.tankSizes || [];
    const size = sizes[Math.min(cfg.size, sizes.length - 1)] || { capacity: 24, decorationSlots: 12 };
    const capacity = Math.max(1, Math.round(size.capacity));
    const eq = (list, tier, kind) => (tier >= 0 && list && list[tier] ? { info: list[tier], kind, wear: 0, broken: false } : null);
    const t = {
      cfg, index, capacity, hardCap: Math.max(capacity, Math.floor(capacity * store.tankHardLimitMultiplier)),
      wq: 1, algae: 0, temp: rules.roomTemperature, ph: cfg.salt ? 8.1 : rules.startingPh, salinity: cfg.salt ? 35 : 0, pests: false,
      filter: eq(sup.filters, cfg.filter, 0), heater: eq(sup.heaters, cfg.heater, 1), bubbler: eq(sup.bubblers, cfg.bubbler, 2),
      residents: [], corpses: 0, clutches: [], wipesLeft: wipesPerSession, decor: Math.max(0, Math.min(cfg.decorations, size.decorationSlots || 99)),
    };
    for (const row of cfg.fish) {
      if (!species.has(row.species)) continue;
      for (let i = 0; i < row.count; i++) {
        if (t.residents.length >= t.hardCap) break;
        t.residents.push(makeFish(row.species, randomGenes(), SIM_GROWTH[row.stage] ?? 1, 1));
        spStat(row.species).start++;
        out.start++;
      }
    }
    if (setup.payUpfront) {
      const free = index === setup.tanks.findIndex((c) => c.role === 0) ? 0 : 1;
      const tankPrice = [store.forSaleTankPrice, store.displayTankPrice, store.breederTankPrice, store.quarantineTankPrice][cfg.role] || 0;
      out.cost.tanks += tankPrice * free;
      for (let i = 1; i <= cfg.size && i < sizes.length; i++) out.cost.tanks += sizes[i].upgradePrice || 0;
      for (const item of [t.filter, t.heater, t.bubbler]) if (item) out.cost.equipment += item.info.price || 0;
      out.cost.equipment += 0;
      for (const f of t.residents) out.cost.fish += f.s.fryPrice || 0;
    }
    return t;
  });
  if (setup.payUpfront) {
    const upfront = out.cost.tanks + out.cost.equipment + out.cost.fish;
    money -= upfront;
    if (money < 0) { out.brokeDay = 0; diary(0, `the starting setup ($${upfront}) costs more than the budget`); }
  }

  const alive = (t) => t.residents.length;
  const overLimit = (t) => Math.max(0, alive(t) - t.capacity);
  const oxygenFor = (t) => (t.bubbler && !t.bubbler.broken ? Math.max(1, Math.round(t.bubbler.info.effect)) : Math.max(1, rules.fishPerTankWithoutBubbler));
  const oxygen = (t) => { const n = oxygenFor(t); return clamp01(1 - Math.max(0, alive(t) - n) / n); };
  const infectionMultiplier = (t) => lerp(rules.dirtyWaterInfectionMultiplier, 1, t.wq) * (t.pests ? 1.3 : 1) * (1 + overLimit(t) * ts.overcrowdedIllnessPerFish);
  const eggsIn = (t) => t.clutches.reduce((n, c) => n + c.genes.length, 0);
  const hasPlants = (t) => t.cfg.plants && t.decor > 0;

  const envMismatch = (s, t) => {
    const temp = outsideBy(t.temp, s.tempMin, s.tempMax) * hb.tempPenaltyPerDegree;
    const ph = outsideBy(t.ph, s.phMin, s.phMax) * hb.phPenaltyPerUnit;
    const salt = outsideBy(t.salinity, s.salinityMin, s.salinityMax) * hb.saltPenaltyPerPpt;
    return clamp01(temp + ph + salt + (1 - t.wq) * 0.5 + (1 - oxygen(t)) * 0.4);
  };

  const comfort = (f, t) => {
    let c = 0.75, liked = 0, sameKind = 0;
    if (f.s.likesPlants && hasPlants(t)) c += hb.plantsBonus;
    if (f.sinceFav <= 1) c += hb.favouriteFoodComfort;
    const grown = new Set(t.residents.filter((o) => o !== f && stage(o) === 2).map((o) => o.sp));
    const seen = new Set();
    const canFight = stage(f) === 2;
    for (const o of t.residents) {
      if (o === f) continue;
      if (o.sp === f.sp) sameKind++;
      if (seen.has(o.sp)) continue;
      seen.add(o.sp);
      const otherGrown = grown.has(o.sp);
      if (otherGrown && relation(o.sp, f.sp) === 1) c -= mates.predatorFear;
      if (canFight && otherGrown && competitive(f.sp, o.sp)) c -= mates.competitiveStress;
      if (relation(f.sp, o.sp) === 3 && liked < 2) { liked++; c += mates.preferredComfort; }
    }
    if (f.s.schoolSize > 0 && sameKind + 1 < f.s.schoolSize) c -= hb.tooFewSchoolmates;
    if (t.decor > hb.idealDecorMax) c -= 0.15; else if (t.decor < hb.idealDecorMin) c -= 0.1; else c += 0.1;
    if (t.pests) c -= hb.pestsComfortLoss;
    if (alive(t) > t.capacity * 0.75) c -= 0.15;
    if (f.stress > 0.01) c -= f.stress;
    return { level: clamp01(c), liked };
  };

  const report = (f, t) => {
    const r = {};
    r.hunger = f.hunger > 0.5 ? (f.hunger - 0.5) / 0.5 * hb.hungerWeight : 0;
    r.illness = f.disease ? (0.25 + 0.75 * f.severity) * f.disease.lethality * hb.illnessWeight : 0;
    const life = f.s.lifespanDays;
    r.oldAge = f.age > life ? clamp01((f.age - life) / Math.max(1, life * 0.5)) * hb.oldAgeWeight : 0;
    r.deadTankmates = t.corpses * hb.perDeadTankmate;
    r.overcrowding = Math.min(hb.overcrowdedMaxPenalty, overLimit(t) * hb.overcrowdedHealthPerFish);
    const cf = comfort(f, t);
    r.comfort = (1 - cf.level) * hb.comfortWeight;
    r.companionship = cf.liked * mates.preferredHealth;
    r.environment = envMismatch(f.s, t) * hb.environmentWeight;
    r.injury = f.injury * mates.injuryWeight;
    r.medicineDamage = f.damage * med.damageHealth;
    r.total = clamp01(1 - r.hunger - r.illness - r.comfort - r.environment - r.oldAge - r.deadTankmates - r.injury - r.medicineDamage - r.overcrowding + r.companionship);
    return r;
  };

  const worstCause = (r, f) => {
    let worst = r.hunger, cause = "starvation";
    const check = (v, name) => { if (v > worst) { worst = v; cause = name; } };
    check(r.illness, f.disease ? f.disease.displayName : "illness");
    check(r.environment, "poor water");
    check(r.comfort, "stress");
    check(r.oldAge, "old age");
    check(r.injury, "wounds");
    check(r.medicineDamage, "medicine poisoning");
    check(r.overcrowding, "an overcrowded tank");
    if (r.deadTankmates > worst) cause = "rot from dead tank mates";
    return cause;
  };

  const pickDisease = () => {
    const total = diseases.reduce((n, d) => n + Math.max(0, d.weight), 0);
    let roll = rnd() * total;
    for (const d of diseases) { roll -= Math.max(0, d.weight); if (roll <= 0) return d; }
    return diseases[diseases.length - 1] || null;
  };
  const infect = (f, d) => {
    if (!d || f.disease) return false;
    f.disease = d; f.severity = 0.1;
    out.fellIll++;
    return true;
  };

  const killFish = (t, f, cause, corpse) => {
    f.dead = true;
    f.pregnant = null;
    t.residents.splice(t.residents.indexOf(f), 1);
    if (corpse) t.corpses++;
    out.causes[cause] = (out.causes[cause] || 0) + 1;
    if (cause === "eaten by a tank mate") { out.eaten++; spStat(f.sp).eaten++; } else { out.died++; spStat(f.sp).died++; }
  };

  const addFry = (t, sp, genes, gen) => {
    if (alive(t) >= t.hardCap || !species.has(sp)) return false;
    t.residents.push(makeFish(sp, genes, 0.05, gen));
    out.born++;
    spStat(sp).born++;
    return true;
  };

  const whyNotReady = (f, t) => stage(f) !== 2 || f.pregnant || f.disease || infertile(f) || starving(f) || f.cooldown > 0 || envMismatch(f.s, t) > ts.maxStressToBreed;

  const conceive = (t, a, b) => {
    const mother = a.male ? b : a, father = mother === a ? b : a;
    const s = mother.s;
    const count = Math.min(rangeInt(s.litterMin, s.litterMax + 1), t.hardCap - alive(t) - eggsIn(t));
    if (count <= 0) return 0;
    const gen = Math.max(a.gen, b.gen) + 1;
    const genes = [];
    for (let i = 0; i < count; i++) genes.push(childGenes(mother.genes, father.genes));
    father.cooldown = rules.breedingCooldownSteps;
    if (s.reproduction === 1) mother.pregnant = { genes, gen, steps: Math.max(1, s.gestationSteps), sp: mother.sp };
    else {
      mother.cooldown = rules.breedingCooldownSteps;
      t.clutches.push({ genes, gen, steps: Math.max(1, s.eggHatchSteps), sp: mother.sp });
    }
    return count;
  };

  const shuffle = (list) => { for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; } return list; };

  const chanceBreeding = (t, p) => {
    const groups = new Map();
    for (const f of t.residents) {
      if (whyNotReady(f, t)) continue;
      if (!groups.has(f.sp)) groups.set(f.sp, { females: [], males: [] });
      groups.get(f.sp)[f.male ? "males" : "females"].push(f);
    }
    const singleF = [], singleM = [];
    for (const g of groups.values()) {
      shuffle(g.females); shuffle(g.males);
      const n = Math.min(g.females.length, g.males.length);
      for (let i = 0; i < n; i++) if (chance(p)) conceive(t, g.females[i], g.males[i]);
      singleF.push(...g.females.slice(n)); singleM.push(...g.males.slice(n));
    }
    const crossP = clamp01(p * clamp01((B.crossBreeding && B.crossBreeding.crossChanceMultiplier) ?? 0.5));
    shuffle(singleF); shuffle(singleM);
    for (const female of singleF) {
      const i = singleM.findIndex((m) => canCross(female.sp, m.sp));
      if (i < 0) continue;
      const male = singleM.splice(i, 1)[0];
      if (chance(crossP)) conceive(t, female, male);
    }
  };

  const receiveMedicine = (f, cure) => {
    if (f.disease && cure !== 0 && cure === f.disease.cure) {
      f.disease = null; f.severity = 0;
      out.cured++;
      f.load += med.loadPerNeededDose;
    } else {
      f.stress = clamp01(f.stress + med.stressPerDose);
      f.load += med.loadPerDose;
    }
    if (f.load >= med.overdoseLoad && f.damage < med.maxDamage) {
      f.damage++;
      f.load = med.overdoseLoad * 0.5;
      out.overdoses++;
    }
  };

  const suggestedTemp = (t) => {
    if (!t.residents.length) return 25;
    let lo = -Infinity, hi = Infinity, mid = 0;
    for (const f of t.residents) { lo = Math.max(lo, f.s.tempMin); hi = Math.min(hi, f.s.tempMax); mid += (f.s.tempMin + f.s.tempMax) / 2; }
    return Math.round(lo <= hi ? (lo + hi) / 2 : mid / t.residents.length);
  };
  for (const t of tanks) {
    t.heaterSetting = t.cfg.heaterTemp > 0 ? t.cfg.heaterTemp : suggestedTemp(t);
    if (t.heater) t.temp = t.heaterSetting;
  }

  // ---- your routine while the shop is closed

  const feed = (t) => {
    const type = t.cfg.food;
    const info = foodInfo(type);
    if (!(stock.food[type] > 0)) {
      if (!spend(info.price, `${info.name || "food"}`, "food")) { out.missedFeedings++; return; }
      stock.food[type] = (stock.food[type] || 0) + Math.max(1, info.feedings);
    }
    stock.food[type]--;
    let pellets = Math.max(8, alive(t) + 2);
    const mult = infectionMultiplier(t);
    let hungry = shuffle(t.residents.filter((f) => f.hunger > 0.25));
    while (pellets > 0 && hungry.length) {
      for (const f of hungry) {
        if (pellets <= 0) break;
        if (f.hunger <= 0.25) continue;
        pellets--;
        const wasStarving = starving(f);
        let nutrition = info.nutrition;
        if ((f.s.favoriteFoods || []).includes(type)) { nutrition *= hb.favouriteFoodNutrition; f.sinceFav = 0; }
        f.hunger = Math.max(0, f.hunger - nutrition);
        if (!f.disease) {
          const spoiled = chance(info.spoilChance);
          let p = rules.baseInfectionChancePerMeal * info.contamination * (spoiled ? 4 : 1) * mult;
          if (wasStarving) p *= rules.starvingInfectionMultiplier;
          p *= 1 - f.hard * rules.hardinessProtection;
          if (chance(clamp01(p))) infect(f, pickDisease());
        }
      }
      hungry = hungry.filter((f) => f.hunger > 0.25);
    }
    t.wq = clamp01(t.wq - pellets * rules.waterQualityLossPerRottenPellet);
  };

  // A breakdown picks one of that equipment's faults by weight; the repair costs the model's repair cost × the fault's cost, give or take the spread.
  const repairPrice = (item) => {
    const faults = (sup.faults || []).filter((f) => f.equipment === item.kind && f.weight > 0);
    let pickCost = 1;
    if (faults.length) {
      let roll = rnd() * faults.reduce((n, f) => n + f.weight, 0);
      for (const f of faults) { roll -= f.weight; if (roll <= 0) { pickCost = f.cost; break; } }
    }
    const spread = clamp01(sup.repairPriceSpread || 0);
    return Math.max(1, Math.round((item.info.repairCost || 15) * pickCost * range(1 - spread, 1 + spread)));
  };

  const routine = (t) => {
    const cfg = t.cfg;
    if (cfg.removeDead) t.corpses = 0;
    if (cfg.repair) for (const item of [t.filter, t.heater, t.bubbler]) {
      if (!item || !item.broken) continue;
      if (!spend(item.repairCost || item.info.repairCost || 15, "repairs", "repairs")) continue;
      item.broken = false;
      item.wear *= 1 - clamp01(sup.repairWearRemoved);
      if (item === t.heater) t.temp = t.heaterSetting;
    }
    if (cfg.treatWater && (t.pests || t.residents.some((f) => t.ph < f.s.phMin || t.ph > f.s.phMax))) {
      if (spend(sup.waterTreatmentPrice || 5, "water conditioner", "conditioner")) {
        t.ph = cfg.salt ? 8.1 : 7.0;
        t.pests = false;
        t.wq = clamp01(t.wq + 0.1);
      }
    }
    if (cfg.treatSick) {
      const cures = [...new Set(t.residents.filter((f) => f.disease && f.disease.cure).map((f) => f.disease.cure))];
      for (const cure of cures) {
        if (!spend(sup.medicinePrice, `${MEDICINES[cure].toLowerCase()} medicine`, "medicine")) break;
        out.doses++;
        for (const f of [...t.residents]) receiveMedicine(f, cure);
      }
    }
    for (let i = 0; i < cfg.wipes && t.wipesLeft > 0; i++) {
      t.wipesLeft--;
      t.algae = clamp01(t.algae - ts.wipeAlgaeRemoved * wipeSkill);
      t.wq = clamp01(t.wq + ts.wipeQualityRestored * wipeSkill);
    }
    for (let i = 0; i < cfg.feedings; i++) feed(t);
    if (cfg.heaterTemp <= 0) {
      t.heaterSetting = suggestedTemp(t);
      if (t.heater && !t.heater.broken) t.temp = t.heaterSetting;
    }
    if (cfg.sellAbove > 0 && alive(t) > cfg.sellAbove) {
      const forSale = t.residents.filter((f) => stage(f) > 0 && !f.pregnant).sort((a, b) => b.age - a.age);
      while (alive(t) > cfg.sellAbove && forSale.length) {
        const f = forSale.shift();
        const price = value(f);
        money += price;
        out.income.sales += price;
        out.sold++;
        spStat(f.sp).sold++;
        t.residents.splice(t.residents.indexOf(f), 1);
      }
    }
  };

  // ---- one time step (the shop opening or closing)

  const timeStep = () => {
    for (const t of tanks) {
      for (const c of [...t.clutches]) {
        const loss = ts.eggLossInFilthyWater * clamp01((0.5 - t.wq) * 2);
        if (loss > 0) c.genes = c.genes.filter(() => !chance(loss));
        if (!c.genes.length) { t.clutches.splice(t.clutches.indexOf(c), 1); continue; }
        if (--c.steps <= 0) {
          t.clutches.splice(t.clutches.indexOf(c), 1);
          for (const g of c.genes) if (!addFry(t, c.sp, g, c.gen)) break;
        }
      }
    }
    for (const t of tanks) for (const f of [...t.residents]) {
      if (!f.pregnant || --f.pregnant.steps > 0) continue;
      const p = f.pregnant;
      f.pregnant = null;
      for (const g of p.genes) if (!addFry(t, p.sp, g, p.gen)) break;
      f.cooldown = rules.breedingCooldownSteps;
    }

    for (const t of tanks) {
      const waste = t.filter && !t.filter.broken ? t.filter.info.effect : 1;
      t.wq = clamp01(t.wq - ts.waterQualityLossPerStep * waste - alive(t) * ts.wasteQualityLossPerFish * waste
        - t.corpses * ts.corpseQualityLoss - overLimit(t) * ts.overcrowdedWastePerFish);
      const growth = ts.algaePerStep + t.decor * ts.algaePerDecoration;
      const grazers = t.residents.filter((f) => f.s.eatsAlgae).length;
      t.algae = clamp01(t.algae + growth * (1.5 - t.wq) - grazers * ts.algaeEatenPerGrazer);
      t.ph = moveTowards(t.ph, (t.salinity > 15 ? 8.1 : 7) - 1.2, ts.phDriftPerStep * (1 - t.wq) * 2);
      if (!t.pests && t.wq < 0.5 && chance(ts.pestChance * (1.5 - t.wq))) t.pests = true;
      for (const item of [t.filter, t.heater, t.bubbler]) {
        if (!item || item.broken) continue;
        item.wear += 1;
        const info = item.info;
        if (chance(clamp01(Math.min(info.maxBreakChance, info.breakChance + info.breakChancePerStep * item.wear)))) { item.broken = true; item.repairCost = repairPrice(item); out.breakdowns++; }
      }
      if (t.heater && !t.heater.broken) t.temp = Math.round((t.heaterSetting + range(-t.heater.info.effect, t.heater.info.effect)) * 10) / 10;
      else t.temp = rules.roomTemperature;
      t.wipesLeft = wipesPerSession;
    }

    for (const t of tanks) for (const f of t.residents) {
      f.age += 0.5;
      f.hunger = clamp01(f.hunger + 0.5 / Math.max(0.5, f.s.hungerToleranceDays) * rules.starvingThreshold);
      if (f.growth < 1 && !starving(f)) f.growth = Math.min(1, f.growth + 0.5 / Math.max(0.5, f.s.daysToAdult));
      if (f.cooldown > 0) f.cooldown--;
      if (f.sinceFav < 99) f.sinceFav++;
    }

    const newly = new Set();
    for (const t of tanks) {
      const mult = infectionMultiplier(t);
      for (const f of t.residents) {
        f.injury = Math.max(0, f.injury - mates.injuryHealPerStep);
        f.load = Math.max(0, f.load - med.loadClearedPerStep);
        f.stress = Math.max(0, f.stress - med.stressRecoveryPerStep);
        if (f.disease) {
          const d = f.disease;
          f.severity = clamp01(f.severity + d.progressionPerStep * (1 - 0.5 * f.hard));
          if (chance(d.recoveryChancePerStep * (0.5 + f.hard))) { f.disease = null; f.severity = 0; out.recovered++; continue; }
          if (d.contagionChancePerStep > 0)
            for (const o of t.residents)
              if (o !== f && !o.disease && !newly.has(o) && chance(d.contagionChancePerStep * (1 - o.hard * rules.hardinessProtection)) && infect(o, d)) newly.add(o);
          continue;
        }
        if (newly.has(f)) continue;
        const p = ts.diseaseChance * (1 + (1 - f.health)) * (1 - f.hard * rules.hardinessProtection) * mult;
        if (chance(p)) infect(f, pickDisease());
      }
    }

    for (const t of tanks) {
      if (!t.cfg.breeding) continue;
      chanceBreeding(t, t.cfg.role === 2 ? ts.pregnancyChanceBreederTank : ts.pregnancyChanceOtherTank);
    }

    for (const t of tanks) {
      const reports = new Map();
      for (const f of t.residents) {
        f.health = moveTowards(f.health, report(f, t).total, hb.healthChangePerStep);
        reports.set(f, report(f, t));
      }
      for (const f of [...t.residents]) {
        if (f.health >= ts.deathHealthThreshold) continue;
        const danger = (ts.deathHealthThreshold - f.health) / Math.max(0.01, ts.deathHealthThreshold);
        if (chance(ts.deathChanceAtZeroHealth * Math.pow(danger, 1.5))) killFish(t, f, worstCause(reports.get(f), f), true);
      }
    }

    for (const t of tanks) {
      for (const hunter of [...t.residents]) {
        if (hunter.dead || stage(hunter) !== 2) continue;
        const prey = t.residents.filter((o) => o !== hunter && relation(hunter.sp, o.sp) === 1);
        if (!prey.length) continue;
        const target = pick(prey);
        if (bodyLength(target) <= bodyLength(hunter) * mates.preyMaxSizeRatio && chance(mates.eatChance)) killFish(t, target, "eaten by a tank mate", false);
        else if (chance(mates.biteChance)) target.injury = clamp01(target.injury + mates.biteInjury);
      }
      if (alive(t) <= t.capacity * mates.crowdedAbove) continue;
      for (const victim of [...t.residents]) {
        if (stage(victim) !== 2) continue;
        const nippers = t.residents.filter((o) => o !== victim && stage(o) === 2 && competitive(victim.sp, o.sp));
        if (nippers.length && chance(mates.nipChance)) victim.injury = clamp01(victim.injury + mates.nipInjury);
      }
    }
  };

  // ---- the days

  const record = () => {
    let total = 0, sick = 0;
    tanks.forEach((t, i) => {
      total += alive(t);
      sick += t.residents.filter((f) => f.disease).length;
      out.tankAlive[i].push(alive(t));
      out.tankWater[i].push(t.wq);
    });
    out.alive.push(total);
    out.money.push(money);
    out.sick.push(sick);
  };
  record();
  for (day = 1; day <= setup.days; day++) {
    const before = { died: out.died, eaten: out.eaten, born: out.born, ill: out.fellIll, cured: out.cured };
    for (const t of tanks) routine(t);
    timeStep();
    timeStep();
    // Grandma: a gift every night before the grand opening; after it, only when you're broke.
    const gift = store.grandmaGift ?? 100;
    if (day <= (data.shop.setupDays ?? 0)) { out.income.allowance += gift; money += gift; }
    else if (money < (store.brokeBelow ?? 10) && setup.allowance) { out.income.allowance += gift; money += gift; out.bailouts++; }
    record();
    const notes = [];
    if (out.born > before.born) notes.push(`${out.born - before.born} born`);
    if (out.fellIll > before.ill) notes.push(`${out.fellIll - before.ill} fell ill`);
    if (out.cured > before.cured) notes.push(`${out.cured - before.cured} cured`);
    if (out.died > before.died) notes.push(`${out.died - before.died} died`);
    if (out.eaten > before.eaten) notes.push(`${out.eaten - before.eaten} eaten`);
    if (notes.length) diary(day, `${notes.join(", ")}. ${out.alive[out.alive.length - 1]} alive, $${money}.`);
  }
  for (const t of tanks) for (const f of t.residents) spStat(f.sp).end++;
  out.endMoney = money;
  out.endWater = tanks.map((t) => t.wq);
  return out;
}

/** Runs the setup many times with different luck and sums it all up. */
/** Runs the setup many times and averages them; yields to the page now and then so it can show progress. */
async function runSimulation(setup, onProgress) {
  const runs = [];
  const n = Math.max(1, Math.min(500, Math.round(setup.runs)));
  let pause = performance.now();
  for (let i = 0; i < n; i++) {
    runs.push(simulate(setup, data, (Math.round(setup.seed) || 1) * 1000 + i));
    if (performance.now() - pause > 100) {
      if (onProgress) onProgress(i + 1, n);
      await new Promise((done) => setTimeout(done, 0));
      pause = performance.now();
    }
  }
  const mean = (f) => runs.reduce((s, r) => s + f(r), 0) / runs.length;
  const series = (get) => {
    const len = get(runs[0]).length;
    const m = [], lo = [], hi = [];
    for (let d = 0; d < len; d++) {
      const vals = runs.map((r) => get(r)[d]);
      m.push(vals.reduce((a, b) => a + b, 0) / vals.length);
      lo.push(Math.min(...vals));
      hi.push(Math.max(...vals));
    }
    return { mean: m, lo, hi };
  };
  const causes = {};
  for (const r of runs) for (const [k, v] of Object.entries(r.causes)) causes[k] = (causes[k] || 0) + v / runs.length;
  const speciesIds = [...new Set(runs.flatMap((r) => Object.keys(r.speciesStats)))];
  const perSpecies = speciesIds.map((id) => {
    const avg = (k) => mean((r) => (r.speciesStats[id] ? r.speciesStats[id][k] : 0));
    return { id, start: avg("start"), end: avg("end"), born: avg("born"), died: avg("died"), eaten: avg("eaten"), sold: avg("sold") };
  });
  const ends = runs.map((r) => r.alive[r.alive.length - 1]);
  const broke = runs.filter((r) => r.brokeDay !== null);
  return {
    setup: JSON.parse(JSON.stringify(setup)), runs: runs.length, start: runs[0].start,
    endAlive: { mean: mean((r) => r.alive[r.alive.length - 1]), lo: Math.min(...ends), hi: Math.max(...ends) },
    born: mean((r) => r.born), died: mean((r) => r.died), eaten: mean((r) => r.eaten), sold: mean((r) => r.sold),
    fellIll: mean((r) => r.fellIll), cured: mean((r) => r.cured), recovered: mean((r) => r.recovered), overdoses: mean((r) => r.overdoses),
    doses: mean((r) => r.doses), breakdowns: mean((r) => r.breakdowns), missedFeedings: mean((r) => r.missedFeedings),
    cost: Object.fromEntries(Object.keys(runs[0].cost).map((k) => [k, mean((r) => r.cost[k])])),
    income: Object.fromEntries(Object.keys(runs[0].income).map((k) => [k, mean((r) => r.income[k])])),
    endMoney: mean((r) => r.endMoney), bailouts: mean((r) => r.bailouts),
    brokeShare: broke.length / runs.length, brokeDay: broke.length ? broke.reduce((s, r) => s + r.brokeDay, 0) / broke.length : null,
    causes, perSpecies,
    alive: series((r) => r.alive), money: series((r) => r.money), sick: series((r) => r.sick),
    tankAlive: setup.tanks.map((_, i) => series((r) => r.tankAlive[i])),
    tankWater: setup.tanks.map((_, i) => series((r) => r.tankWater[i])),
    diary: runs[0].diary,
  };
}

function simInput(obj, key, opts = {}) {
  const changed = (v) => { obj[key] = v; saveSimSetup(); if (opts.rerender) render(); };
  let control;
  if (opts.options) {
    control = el("select", { onchange: (e) => changed(opts.numeric === false ? e.target.value : parseInt(e.target.value, 10)) },
      opts.options.map(([v, label]) => el("option", { value: v }, label)));
    control.value = obj[key];
  } else if (typeof obj[key] === "boolean") {
    control = el("input", { type: "checkbox", onchange: (e) => changed(e.target.checked) });
    control.checked = obj[key];
    return el("label", { class: "field check", title: opts.help || "" }, control, opts.label);
  } else {
    control = el("input", { type: "number", step: opts.step || "1", min: opts.min ?? 0, value: obj[key], oninput: (e) => { const n = parseFloat(e.target.value); if (!isNaN(n)) changed(n); } });

}

/** A single-series line over the days: the average, with a band from the worst to the best run. */
function lineChart(title, series, format, days, fixedMax) {
  const W = 560, H = 190, L = 48, R = 12, T = 12, Bm = 26;
  const rawMax = fixedMax ?? Math.max(1, ...series.hi);
  const rawMin = Math.min(0, ...series.lo);
  // Round gridlines: steps of 1, 2, 2.5 or 5 times a power of ten.
  const rough = (rawMax - rawMin) / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = fixedMax != null ? rough : [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= rough);
  const maxV = fixedMax ?? Math.ceil(rawMax / step - 1e-9) * step;
  const minV = Math.floor(rawMin / step + 1e-9) * step;
  const x = (d) => L + (W - L - R) * (days > 1 ? d / (days - 1) : 0);
  const y = (v) => T + (H - T - Bm) * (1 - (v - minV) / (maxV - minV || 1));
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${title} over ${days - 1} days`);
  const add = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    svg.append(n);
    return n;
  };
  for (let v = minV; v <= maxV + step * 0.01; v += step) {
    add("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), class: "grid" });
    add("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end", class: "axis" }, format(v));
  }
  const ticks = Math.min(6, days - 1);
  for (let i = 0; i <= ticks; i++) {
    const d = Math.round((days - 1) * i / Math.max(1, ticks));
    add("text", { x: x(d), y: H - 8, "text-anchor": "middle", class: "axis" }, `${d}`);
  }
  const band = series.hi.map((v, d) => `${x(d)},${y(v)}`).concat(series.lo.map((v, d) => `${x(d)},${y(v)}`).reverse()).join(" ");
  add("polygon", { points: band, class: "band" });
  add("polyline", { points: series.mean.map((v, d) => `${x(d)},${y(v)}`).join(" "), class: "line" });
  const hair = add("line", { x1: 0, x2: 0, y1: T, y2: H - Bm, class: "hair", visibility: "hidden" });
  const dot = add("circle", { r: 4, class: "dot", visibility: "hidden" });
  const tip = el("div", { class: "tip" });
  const wrap = el("div", { class: "chart-wrap" }, el("div", { class: "chart-title" }, title), svg, tip);
  const hide = () => { hair.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
  svg.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect();
    const px = (e.clientX - box.left) / box.width * W;
    const d = Math.max(0, Math.min(days - 1, Math.round((px - L) / (W - L - R) * (days - 1))));
    hair.setAttribute("x1", x(d)); hair.setAttribute("x2", x(d)); hair.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x(d)); dot.setAttribute("cy", y(series.mean[d])); dot.setAttribute("visibility", "visible");
    tip.replaceChildren(el("b", {}, format(series.mean[d])), ` on day ${d}`, el("br"), el("span", {}, `runs ranged ${format(series.lo[d])} to ${format(series.hi[d])}`));
    tip.style.display = "block";
    const left = (x(d) / W) * box.width;
    tip.style.left = `${Math.min(box.width - 170, Math.max(0, left + 10))}px`;
  });
  svg.addEventListener("pointerleave", hide);
  return wrap;
}

function searchResults(text) {
  const words = text.toLowerCase().split(/\s+/).filter((w) => w);
  const groups = new Map();
  const visit = (obj, crumbs) => {
    for (const key of Object.keys(obj)) {
      const value = obj[key];
      if (key === "pairs") continue;
      if (Array.isArray(value) && value.length && typeof value[0] === "object") {
        value.forEach((item, i) => visit(item, [...crumbs, nice(key), itemName(item, i)]));
        continue;
      }
      if (value && typeof value === "object" && !Array.isArray(value) && !("r" in value && "g" in value)) {
        visit(value, [...crumbs, TOP_NAMES[key] || nice(key)]);
        continue;
      }
      const hay = [key, nice(key), help(key), ...crumbs].join(" ").toLowerCase();
      if (!words.every((w) => hay.includes(w))) continue;
      const where = crumbs.join(" › ");
      if (!groups.has(where)) groups.set(where, { obj, keys: [] });
      groups.get(where).keys.push(key);
    }
  };
  for (const key of Object.keys(data)) {
    if (key === "relationships" || key === "dataVersion") continue;
    const value = data[key];
    if (Array.isArray(value)) value.forEach((item, i) => item && typeof item === "object" && visit(item, [TOP_NAMES[key] || nice(key), itemName(item, i)]));
    else if (value && typeof value === "object") visit(value, [TOP_NAMES[key] || nice(key)]);
  }
  return groups;
}

function renderSearch() {
  const groups = searchResults(query);
  let shown = 0;
  const cards = [];
  for (const [where, { obj, keys }] of groups) {
    if (shown > 300) break;
    shown += keys.length;
    cards.push(el("div", { class: "card" }, el("p", { class: "crumbs" }, where), el("div", { class: "grid" }, keys.map((k) => field(obj, k)))));
  }
  const total = [...groups.values()].reduce((n, g) => n + g.keys.length, 0);
  return [el("p", { class: "hint" }, total ? `${total} setting${total === 1 ? "" : "s"} match "${query}". Edits here are the same as on the tabs.` : `Nothing matches "${query}".`), ...cards];
}

function renderRaw() {
  const area = el("textarea", { class: "raw" });
  area.value = JSON.stringify(data, null, 2);
  return [el("div", { class: "card" },
    el("p", { class: "hint" }, "The whole balance file. Edit and press Apply, then Save."),
    area,
    el("div", { class: "row", style: "margin-top:10px" }, el("button", { onclick: () => {
      try { data = JSON.parse(area.value); markDirty(); toast("Applied. Press Save to keep it."); }
      catch (e) { toast("That isn't valid JSON: " + e.message); }
    } }, "Apply")))];
}

// ---------------------------------------------------------------- egg hatching

let eggTier = 0;
const eggCheck = { level: 1, day: 30 };

/** The game's rule for filling an empty hatch table from a tier's rarity settings (see EggTierBalance.FillHatchTables). */
function fillHatch(tier) {
  const falloff = Math.max(0.001, tier.normalRarityFalloff);
  const normals = data.species.filter((s) => s.rarity >= tier.normalMin && s.rarity <= tier.normalMax);
  const rares = data.species.filter((s) => !(s.rarity >= tier.normalMin && s.rarity <= tier.normalMax) && s.rarity === tier.rarePool);
  const total = normals.reduce((n, s) => n + Math.pow(falloff, s.rarity - tier.normalMin), 0);
  tier.hatch = [];
  for (const s of data.species) {
    let w = 0;
    if (normals.includes(s) && total > 0) w = (1 - tier.rareChance) * Math.pow(falloff, s.rarity - tier.normalMin) / total;
    else if (rares.includes(s)) w = tier.rareChance / rares.length;
    if (w > 0) tier.hatch.push({ species: s.id, weight: Math.round(w * 1000) / 10, fromLevel: s.unlockLevel, fromDay: 0 });
  }
}

/** Chance each species hatches from one egg (the first in a box) at the check level and day. */
function hatchOdds(tier, eggsOnly) {
  const rows = (tier.hatch || []).filter((h) => {
    const s = speciesById(h.species);
    return s && h.weight > 0 && h.fromLevel <= eggCheck.level && h.fromDay <= eggCheck.day && (!eggsOnly || s.reproduction === 0);
  });
  const total = rows.reduce((n, h) => n + h.weight, 0);
  const odds = {};
  for (const h of rows) odds[h.species] = total > 0 ? h.weight / total : 0;
  return odds;
}

const pct = (p) => (p === undefined ? "–" : p < 0.001 ? "<0.1%" : `${(p * 100).toFixed(p < 0.1 ? 1 : 0)}%`);

function renderEggs() {
  const tiers = data.supplier.eggTiers;
  eggTier = Math.min(eggTier, tiers.length - 1);
  tiers.forEach((t) => { if (!t.hatch || !t.hatch.length) fillHatch(t); });
  const tier = tiers[eggTier];

  const check = el("div", { class: "row" },
    el("label", { class: "field", title: "Fishkeeping level the odds below are worked out for." }, el("span", {}, "Check odds at Fishkeeping level"),
      el("input", { type: "number", value: eggCheck.level, oninput: (e) => { eggCheck.level = parseInt(e.target.value, 10) || 1; refresh(); } })),
    el("label", { class: "field", title: "Game day the odds below are worked out for." }, el("span", {}, "on day"),
      el("input", { type: "number", value: eggCheck.day, oninput: (e) => { eggCheck.day = parseInt(e.target.value, 10) || 1; refresh(); } })));

  // Overview: every species against every tier, as the chance one egg (or fry) is that fish.
  const overviewBody = el("tbody");
  const drawOverview = () => {
    const eggOdds = tiers.map((t) => hatchOdds(t, true));
    const fryOdds = tiers.map((t) => hatchOdds(t, false));
    overviewBody.replaceChildren(...data.species.map((s) => el("tr", {},
      el("td", {}, s.displayName), el("td", {}, ENUMS.rarity[s.rarity]), el("td", {}, s.reproduction === 0 ? "Eggs" : "Fry only"),
      tiers.map((t, i) => el("td", { class: "pct readout", title: `${t.name}: eggs ${pct(eggOdds[i][s.id])}, fry boxes ${pct(fryOdds[i][s.id])}` },
        `${pct(eggOdds[i][s.id])} / ${pct(fryOdds[i][s.id])}`)))));
  };
  const overview = el("div", { class: "card" },
    el("h2", {}, "Which box hatches what"),
    el("p", { class: "hint" }, "The chance one egg / one fry from each box is that fish, at the level and day above (before any rare fish in the box: each rare one makes the next less likely by the tier's rare falloff). Livebearers only come in fry boxes. Boxes also only hold fish that fit the tank they're bought for."),
    el("div", { class: "scroll" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Species"), el("th", {}, "Rarity"), el("th", {}, "Comes as"), tiers.map((t) => el("th", {}, t.name)))),
      overviewBody)));

  // Editor for one tier: every species, with its weight and when it can turn up.
  const tierButtons = el("div", { class: "list", style: "flex-direction:row;flex-wrap:wrap;display:flex;gap:6px" }, tiers.map((t, i) =>
    el("button", { class: i === eggTier ? "active" : "", onclick: () => { eggTier = i; render(); } }, t.name)));
  const editBody = el("tbody");
  const entry = (s) => tier.hatch.find((h) => h.species === s.id);
  const readouts = [];
  // Rows are built once, so typing keeps its place; only the percentages update.
  editBody.replaceChildren(...data.species.map((s) => {
    const h = entry(s) || { species: s.id, weight: 0, fromLevel: s.unlockLevel, fromDay: 0 };
    const num = (key, step) => el("input", { type: "number", step, value: h[key], oninput: (e) => {
      const n = parseFloat(e.target.value);
      if (isNaN(n)) return;
      h[key] = key === "weight" ? Math.max(0, n) : Math.round(n);
      if (!entry(s)) tier.hatch.push(h);
      markDirty();
      refresh();
    } });
    const rare = s.rarity >= tier.rarePool;
    const egg = el("td", { class: "pct readout" }), fry = el("td", { class: "pct readout" });
    const row = el("tr", {},
      el("td", {}, s.displayName), el("td", {}, ENUMS.rarity[s.rarity] + (rare ? " (rare)" : "")),
      el("td", {}, num("weight", "0.1")), el("td", {}, num("fromLevel", "1")), el("td", {}, num("fromDay", "1")), egg, fry);
    readouts.push({ s, h: () => entry(s), row, egg, fry });
    return row;
  }));
  const refresh = () => {
    drawOverview();
    const eggOdds = hatchOdds(tier, true), fryOdds = hatchOdds(tier, false);
    for (const r of readouts) {
      const h = r.h();
      r.row.classList.toggle("off", !h || h.weight <= 0);
      r.egg.textContent = r.s.reproduction === 0 ? pct(eggOdds[r.s.id]) : "fry only";
      r.fry.textContent = pct(fryOdds[r.s.id]);
    }
  };
  refresh();
  const editor = el("div", { class: "card" },
    el("h2", {}, "Edit a box"),
    tierButtons,
    el("p", { class: "hint", style: "margin-top:8px" }, `${tier.name}: ${tier.eggs} per box, $${tier.price} as eggs, $${tier.fryPrice} as fry, from Fishkeeping level ${tier.unlockLevel}. Chance is relative: a fish with chance 20 is twice as likely as one with 10. 0 means never. Fish of ${ENUMS.rarity[tier.rarePool]} rarity or rarer count as rare in this box (rare falloff ${tier.rareFalloff}). The percentages are for the level and day above.`),
    el("div", { class: "scroll" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Species"), el("th", {}, "Rarity"), el("th", { title: "Relative chance against the other fish this box can hatch right now." }, "Chance"),
        el("th", { title: "Fishkeeping level from which it can hatch." }, "From level"), el("th", { title: "Game day from which it can hatch (0 = from the start)." }, "From day"),
        el("th", {}, "Per egg"), el("th", {}, "Per fry"))),
      editBody)),
    el("div", { class: "row", style: "margin-top:8px" },
      el("button", { class: "small", title: "Throw this box's table away and build it again from its pool and rare chance settings (Eggs, decor & tanks tab).", onclick: () => {
        if (!confirm(`Rebuild the ${tier.name} table from its rarity settings?`)) return;
        fillHatch(tier); markDirty(); render();
      } }, "Rebuild from rarity settings")));
  return [el("p", { class: "hint" }, "Which fish come in each egg and fry box, how likely each one is, and from when (Fishkeeping level and game day). Edits apply to the game when you Save."), el("div", { class: "card" }, check), overview, editor];
}

// ---------------------------------------------------------------- sorting

// Every table (except the relationship and cross-breeding grids) sorts by a click on a column
// heading; click again to flip it. The order is remembered per tab and table while the page is
// open, and kept when a table is redrawn. Rows that start with a heading cell (group titles,
// totals) stay where they are and the rows between them sort on their own.
const sortState = {};
let tableObserver = null;

function cellValue(td) {
  if (!td) return "";
  const control = td.querySelector("select, input");
  if (control) {
    if (control.tagName === "SELECT") return (control.options[control.selectedIndex] || { text: "" }).text.toLowerCase();
    if (control.type === "checkbox") return control.checked ? 1 : 0;
    if (control.type === "number") { const n = parseFloat(control.value); return isNaN(n) ? -Infinity : n; }
    return control.value.toLowerCase();
  }
  const text = td.textContent.trim();
  const cleaned = text.replace(/[$,%+\s]|days?|sales|traffic/g, "").replace(/^−/, "-");
  const n = parseFloat(cleaned);
  return !isNaN(n) && /^-?[\d.]+$/.test(cleaned) ? n : text.toLowerCase();
}

function compareValues(a, b) {
  if (typeof a === "number" && typeof b === "number") return a - b;
  if (typeof a === "number") return -1;
  if (typeof b === "number") return 1;
  return String(a).localeCompare(String(b), undefined, { numeric: true });
}

function applySort(table) {
  const state = sortState[table._sortKey];
  const heads = table._sortHeads || [];
  heads.forEach((th, i) => th.classList.toggle("asc", !!state && state.col === i && state.dir > 0));
  heads.forEach((th, i) => th.classList.toggle("desc", !!state && state.col === i && state.dir < 0));
  const body = table.tBodies[0];
  if (!state || !body) return;
  const ordered = [];
  let group = [];
  const flush = () => {
    group.sort((a, b) => compareValues(cellValue(a.cells[state.col]), cellValue(b.cells[state.col])) * state.dir);
    ordered.push(...group);
    group = [];
  };
  for (const row of [...body.rows]) {
    if (row.cells[0] && row.cells[0].tagName === "TH") { flush(); ordered.push(row); }
    else group.push(row);
  }
  flush();
  if (ordered.every((row, i) => body.rows[i] === row)) return;
  ordered.forEach((row) => body.appendChild(row));
  // Our own moves would come back to the observer (it runs later), so drop them here.
  if (tableObserver) tableObserver.takeRecords();
}

function makeSortable(root) {
  root.querySelectorAll("table").forEach((table, index) => {
    if (table._sortKey || table.classList.contains("matrix") || !table.tHead || !table.tBodies[0]) return;
    const row = table.tHead.rows[table.tHead.rows.length - 1];
    const heads = [...row.cells];
    table._sortKey = `${tab}#${index}:${heads.map((th) => th.textContent).join("|")}`;
    table._sortHeads = heads;
    table.classList.add("sortable");
    heads.forEach((th, col) => {
      if (!th.textContent.trim()) return;
      th.classList.add("sorthead");
      th.addEventListener("click", () => {
        const old = sortState[table._sortKey];
        sortState[table._sortKey] = { col, dir: old && old.col === col ? -old.dir : 1 };
        applySort(table);
      });
    });
    applySort(table);
  });
}

// Tables drawn later (simulator results) become sortable too, and a redrawn table body
// (a row added or removed) keeps its order. Typing in a cell never moves rows.
tableObserver = new MutationObserver((mutations) => {
  makeSortable($("#view"));
  const redrawn = new Set();
  for (const m of mutations)
    if (m.target.tagName === "TBODY" && m.target.parentNode && m.target.parentNode._sortKey) redrawn.add(m.target.parentNode);
  redrawn.forEach(applySort);
});
tableObserver.observe($("#view"), { childList: true, subtree: true });

function render() {
  indexPaths();
  $("#tabs").replaceChildren(...TABS.map(([key, name]) =>
    el("button", { class: key === tab ? "active" : "", onclick: () => { tab = key; query = ""; $("#search").value = ""; render(); } },
      key === "pinned" && pins.length ? `${name} (${pins.length})` : name)));
  let content;
  if (query.trim()) {
    $("#tabs").querySelectorAll("button").forEach((b) => b.classList.remove("active"));
    $("#view").replaceChildren(...renderSearch());
    return;
  }
  switch (tab) {
    case "species": content = renderSpecies(); break;
    case "compat": content = renderCompat(); break;
    case "cross": content = renderCross(); break;
    case "diseases": content = renderDiseases(); break;
    case "raw": content = renderRaw(); break;
    case "pinned": content = renderPinned(); break;
    case "sim": content = renderSim(); break;
    case "eggs": content = renderEggs(); break;
    default: content = renderSection(tab);
  }
  $("#view").replaceChildren(...content);
  makeSortable($("#view"));
}

$("#save").onclick = save;
$("#search").addEventListener("input", (e) => { query = e.target.value; render(); });
$("#reload").onclick = () => { if (!dirty || confirm("Throw away unsaved changes?")) load("/api/balance"); };
$("#defaults").onclick = () => { if (confirm("Load the game's built-in defaults? Nothing is saved until you press Save.")) load("/api/defaults"); };
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } });
if (pins.length) tab = "pinned";
load("/api/balance").catch(() => { $("#status").textContent = "Can't reach Unity. Open the project, then use Fish Breeder > Balance Console."; });
setInterval(() => { if (!dirty) refreshStatus(""); }, 5000);
</script>
